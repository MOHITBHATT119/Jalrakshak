services:
  - type: web
    name: jalrakshak-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_AI_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: WATSONX_MODEL_ID
        value: ibm/granite-4-h-small
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        sync: false
